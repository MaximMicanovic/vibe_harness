[project]
name = "vibe-harness"
version = "0.1.0"
description = "Post-it note dashboard that spins up headless Mistral Vibe sessions to implement specs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The dead-code guard (tests/test_no_dead_code.py). Deliberately minimal: this
# is not a style linter, it only stops unused imports (F401) and unused locals
# (F841) from piling up again.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F401", "F841"]
