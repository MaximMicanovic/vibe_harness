name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Node.js (front-end checks must run, not skip)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (pytest + ruff via the dev extra)
        run: uv sync --extra dev

      - name: Fail loudly if node or ruff is missing
        run: |
          node --version
          uv run ruff --version

      - name: Test
        run: uv run pytest -q

      - name: Dead-code gate
        run: uv run ruff check app/
